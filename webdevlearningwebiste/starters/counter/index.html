<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Counter App - Starter</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:32px;background:#0f1724;color:#fff}
    .card{background:rgba(255,255,255,0.04);padding:24px;border-radius:12px;max-width:420px}
    button{padding:10px 16px;border-radius:8px;border:none;background:#8b5cf6;color:#fff;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <h1>Counter</h1>
    <div style="display:flex;gap:12px;align-items:center;">
      <button id="dec">-</button>
      <div id="count" style="min-width:60px;text-align:center;font-weight:700">0</div>
      <button id="inc">+</button>
    </div>
    <p style="margin-top:12px;color:#9aa0b4;font-size:0.9rem">Simple starter to practice DOM updates and events.</p>
  </div>

  <script>
    let count = 0;
    const el = document.getElementById('count');
    document.getElementById('inc').addEventListener('click', () => { count++; render(); });
    document.getElementById('dec').addEventListener('click', () => { count--; render(); });
    function render(){ el.textContent = count; }
    render();
  </script>
</body>
</html>
