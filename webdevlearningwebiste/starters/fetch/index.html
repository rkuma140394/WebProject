<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fetch Starter</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:24px;background:#071022;color:#fff}button{padding:8px 12px;border-radius:8px;border:none;background:#8b5cf6;color:#fff}pre{background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;overflow:auto}</style>
</head>
<body>
  <h1>Fetch Starter</h1>
  <p>Click to fetch data from JSONPlaceholder.</p>
  <button id="go">Fetch Post</button>
  <pre id="out">No data fetched yet.</pre>

  <script>
    document.getElementById('go').addEventListener('click', async () => {
      const out = document.getElementById('out');
      out.textContent = 'Loading...';
      try {
        const resp = await fetch('https://jsonplaceholder.typicode.com/posts/1');
        const data = await resp.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        out.textContent = 'Fetch failed: ' + err.message;
      }
    });
  </script>
</body>
</html>
