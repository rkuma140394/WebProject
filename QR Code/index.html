<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <div class="container">
        <div class="brand">
            <div class="brand-icon">QR</div>
            <div>
                <h1>QR Code Studio</h1>
                <p>Create elegant QR codes instantly</p>
            </div>
        </div>

        <label for="qrText">Enter your text or URL</label>
        <div class="input-wrapper">
            <input type="text" placeholder="https://example.com" id="qrText">
        </div>

        <div id="imgBox" class="qr-preview">
            <img src="" id="qrImage" alt="Generated QR code">
        </div>

        <div class="actions">
            <button type="button" class="primary-btn" onclick="generateQR()">Generate QR Code</button>
            <button type="button" class="secondary-btn" id="downloadBtn" onclick="downloadQR()" disabled>Download QR</button>
        </div>
        <p class="hint">Tip: paste a link, message, or contact detail.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
